<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Ofertas de Videojuegos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="bg-dark text-white text-center py-4 mb-4">
    <h1>Buscador de Ofertas de Videojuegos</h1>
    <p>Consulta ofertas de juegos de PC usando una API</p>
  </header>

  <main class="container">

    <section class="row mb-4 justify-content-center">
      <div class="col-md-6">
        <div class="input-group">
          <input type="text" id="searchInput" class="form-control" placeholder="Escribe el nombre de un juego (ej: Batman, Zelda)...">
          <button id="searchBtn" class="btn btn-primary" type="button">Buscar</button>
        </div>
      </div>
    </section>

    <section class="row text-center mb-3">
      <div class="col-12">
        <h3><span id="errorSpan" class="text-danger"></span></h3>
      </div>
    </section>

    <section class="juegos"></section>

  </main>

  <footer class="text-center py-4 mt-5 bg-dark text-white">
    <p>Las mejores Ofertas :D</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
